name: Release

# Cutting a tag like v0.2.0 (or running this manually) builds the installers
# for Windows and Linux, attaches them to a GitHub Release, and publishes the
# signed `latest.json` updater manifest that installed apps poll.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Fail the release before it ever builds if the code is not sound.
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key. Generate with `npm run tauri signer generate`
          # and store the PRIVATE key as a repository secret. The matching
          # PUBLIC key lives in src-tauri/tauri.conf.json and is safe to commit.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Bet Tracker v__VERSION__"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          # Signed updater artifacts are enabled only here, so a local
          # `npm run tauri:build` works without any signing key.
          args: --config src-tauri/tauri.updater.conf.json
          # Publish the updater manifest alongside the bundles.
          uploadUpdaterJson: true
          # Prefer the NSIS installer on Windows for update downloads.
          updaterJsonPreferNsis: true
