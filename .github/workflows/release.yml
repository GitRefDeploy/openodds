name: Release

# Cutting a tag like v0.2.0 (or running this manually) builds installers for
# Windows x64, Windows x86 (32-bit) and Linux, attaches them to a GitHub
# Release, and publishes the signed `latest.json` updater manifest that
# installed apps poll.
#
# The release is staged as a draft and published by the verify job at the end,
# so it only becomes public once every installer and manifest entry has been
# checked. No human step is needed to finish a release off.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges each platform into the release's latest.json, but it
      # does so by reading the existing file, adding its own entry and uploading
      # a replacement. Two jobs running at once can both read the old copy and
      # the loser's entry is silently lost. Serialising the builds keeps the
      # manifest complete; a release is built rarely enough that the extra
      # wall-clock time is worth the correctness.
      max-parallel: 1
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            rustTarget: ""
            args: "--bundles msi,nsis"
          - label: Windows x86 (32-bit)
            platform: windows-latest
            rustTarget: "i686-pc-windows-msvc"
            # NSIS only. Tauri's NSIS setup is itself a 32-bit executable, so
            # the single installer works on both 32- and 64-bit Windows, and it
            # avoids the much less travelled 32-bit MSI path.
            args: "--target i686-pc-windows-msvc --bundles nsis"
          - label: Linux x64
            platform: ubuntu-22.04
            rustTarget: ""
            # deb covers Debian/Ubuntu and their derivatives; the AppImage is
            # distro-agnostic and covers everything else. RPM is left out
            # because it needs extra tooling on the runner and adds little over
            # the AppImage.
            args: "--bundles deb,appimage"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri's docs recommend building on the oldest base system you intend to
      # support, because the glibc version of the build machine becomes the
      # app's minimum. ubuntu-22.04 is the documented baseline.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Empty for the native targets; the 32-bit cross-compile needs the
          # i686 std library installed up front.
          targets: ${{ matrix.rustTarget }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Separate cache per architecture, otherwise the x64 and x86 jobs
          # evict each other's artifacts on every run.
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: npm ci

      # Fail the release before it ever builds if the code is not sound.
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key: signs each installer so installed apps can
          # verify an update is genuine. The PRIVATE key is a repository secret;
          # the matching PUBLIC key is committed in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OpenOdds v__VERSION__"
          releaseBody: |
            Download the file for your machine:

            - **Windows 64-bit** — `OpenOdds_*_x64-setup.exe` (recommended)
              or the `.msi` if you prefer a traditional installer.
            - **Windows 32-bit** — `OpenOdds_*_x86-setup.exe`.
            - **Linux, Debian/Ubuntu** — the `.deb`.
            - **Linux, everything else** — the `.AppImage`. Make it executable
              first: `chmod +x OpenOdds*.AppImage`

            These builds are not code-signed, so Windows SmartScreen will warn
            about an unknown publisher. Choose **More info → Run anyway** to
            continue.
          # Staged as a draft on purpose: the verify job below checks the
          # installers and the manifest, and then publishes the release. A
          # release therefore cannot go public unverified, and a release whose
          # checks fail stays a draft for someone to look at.
          releaseDraft: true
          prerelease: false
          # Signed updater artifacts are enabled only here, so a local
          # `npm run tauri:build` works without any signing key.
          args: "--config src-tauri/tauri.updater.conf.json ${{ matrix.args }}"
          # Publish the updater manifest alongside the bundles.
          uploadUpdaterJson: true
          # Prefer the NSIS installer on Windows for update downloads.
          updaterJsonPreferNsis: true
          # latest.json is built by a read-modify-write against the release, so
          # a transient API conflict is worth retrying rather than failing the
          # whole release.
          retryAttempts: 3

  # The release job reports success if each platform's build and upload worked.
  # This job checks the thing a user actually cares about: that every installer
  # is really on the release, that each one carries an updater signature, and
  # that the manifest describes all three architectures. A green build that
  # shipped an incomplete manifest would otherwise go unnoticed until someone's
  # app failed to update.
  #
  # This job is also what publishes the release: everything above stages it as
  # a draft, and the last step here takes it out of draft once — and only once —
  # the checks have passed. The checks are a gate, not a report.
  verify:
    name: Verify the installers and manifest, then publish
    needs: publish
    runs-on: ubuntu-22.04
    # Write, not read — and not because this job writes anything before its last
    # step. GitHub's release API omits *draft* releases from read-only tokens, so
    # with `read` this job cannot see the very release it exists to check and
    # fails with "release not found" on every run, however good the release is.
    # Narrowing this back to `read` reintroduces that failure.
    permissions:
      contents: write
    steps:
      - name: Check every installer and the manifest are present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does not check the code out, so `gh` has no repository to
          # infer from and would fail before testing anything.
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          names=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets on release $TAG:"
          printf '%s\n' "$names" | sort

          fail=0
          for expected in "_x64-setup.exe" "_x86-setup.exe" ".msi" ".deb" ".AppImage" "latest.json"; do
            # A here-string rather than a pipe: `grep -q` exits on the first
            # match, which can SIGPIPE the writer, and `pipefail` would then
            # turn that into a false failure.
            if grep -qF -- "$expected" <<<"$names"; then
              echo "ok:   found *$expected"
            else
              echo "FAIL: no asset matching *$expected"
              fail=1
            fi
          done

          # An installer without its signature cannot be installed by the
          # updater, so the two counts must agree.
          installers=$(grep -cE '\.(msi|exe|deb|AppImage)$' <<<"$names" || true)
          signatures=$(grep -c '\.sig$' <<<"$names" || true)
          echo "installers=$installers signatures=$signatures"
          if [ "$installers" -gt 0 ] && [ "$installers" -eq "$signatures" ]; then
            echo "ok:   every installer has an updater signature"
          else
            echo "FAIL: installers and signatures do not match (updates would be rejected)"
            fail=1
          fi

          echo
          echo "Updater manifest:"
          gh release download "$TAG" --repo "$REPO" -p latest.json -D "$RUNNER_TEMP" --clobber
          cat "$RUNNER_TEMP/latest.json"

          echo
          for key in windows-x86_64 windows-i686 linux-x86_64; do
            if jq -e --arg k "$key" '.platforms | has($k)' "$RUNNER_TEMP/latest.json" >/dev/null; then
              echo "ok:   latest.json advertises $key"
            else
              echo "FAIL: latest.json is missing the $key entry"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] || { echo "Release verification failed."; exit 1; }
          echo "All release checks passed."

      # A failed step aborts the job, so arriving here means every check above
      # passed. Publishing from the workflow rather than leaving it to a person
      # is what stops a verified release from sitting invisible because nobody
      # remembered to click anything.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "$TAG was already published; nothing to do."
            exit 0
          fi

          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG — installed apps will now be offered it."
