name: CI

# Catches breakage on every pull request instead of at release time. The
# release workflow only runs on tags, so without this a broken change would
# not be noticed until someone cut a version.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege — this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, typecheck and lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The compiler cannot see a stale dependency array or a hook called
      # conditionally, so without this step those only surface in review.
      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  tauri-build:
    name: Tauri build smoke check (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            platform: ubuntu-22.04
            rustTarget: ""
            targetArg: ""
          # The release workflow ships a 32-bit Windows installer, and nothing
          # else compiles that target. Without this check, a dependency that
          # drops 32-bit support would only be discovered while cutting a
          # release.
          - label: Windows x86 (32-bit)
            platform: windows-latest
            rustTarget: "i686-pc-windows-msvc"
            targetArg: "--target i686-pc-windows-msvc"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.label }}

      - name: Install dependencies
        run: npm ci

      # Compiles the Rust shell and embeds the frontend, but skips bundling
      # installers: that needs extra tooling and is covered by the release
      # workflow. No signing key is required because updater artifacts are
      # enabled only in CI releases.
      - name: Build the desktop app (no bundle)
        run: npm run tauri -- build --no-bundle ${{ matrix.targetArg }}

  # Ground rule 5 in CONTRIBUTING.md says a commit credits only the person
  # accountable for it. A rule with no check behind it is a preference, and the
  # failure mode is silent: the trailer is only visible to someone who opens the
  # commit, and after a release it cannot be removed from the tags at all.
  credit:
    name: No agent credit in commits or pull requests
    runs-on: ubuntu-22.04
    # Overrides the workflow's read-only default: a pull request's description is
    # read with the pull-requests scope, not the contents one.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Every message is read out of the repository, so the history has to be
          # present rather than the single commit a default checkout gets.
          fetch-depth: 0

      - name: Check the commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # On a push, GitHub reports the tip the branch pointed at beforehand,
          # which keeps this to the commits the push adds. A first push or one
          # that replaced history can leave that commit unreachable, and then the
          # whole history is scanned instead — which for a repository this size
          # costs nothing and means no push can carry credit forward unnoticed.
          if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD"
          fi
          scripts/check-credit.sh commits "${range}"

      - name: Check the pull request description
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .body > "${RUNNER_TEMP}/pr-body.md"
          scripts/check-credit.sh text "${RUNNER_TEMP}/pr-body.md"
